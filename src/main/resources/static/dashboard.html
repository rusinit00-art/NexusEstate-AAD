<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEstate | Premium Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-nexus { background-color: #020617; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.4); }
        .sidebar-active { background: linear-gradient(to right, rgba(16, 185, 129, 0.15), transparent); border-left: 4px solid #10b981; color: #10b981; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .prop-image { height: 180px; width: 100%; object-fit: cover; border-radius: 1.5rem; }
    </style>
</head>
<body class="bg-nexus text-slate-300 font-sans overflow-hidden">

<div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-80 bg-slate-950 border-r border-slate-900 flex flex-col hidden lg:flex">
        <div class="p-10 border-b border-slate-900 flex items-center gap-4">
            <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-emerald-500/20">
                <i class="fa-solid fa-house-chimney-window text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tighter uppercase">Nexus<span class="text-emerald-500">Estate</span></h1>
                <p class="text-[9px] font-bold text-slate-500 tracking-[0.2em] uppercase">Enterprise Suite</p>
            </div>
        </div>

        <nav class="flex-1 px-6 py-8 space-y-2 overflow-y-auto">
            <button onclick="nav('overview')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all sidebar-active">
                <i class="fa-solid fa-chart-line text-lg"></i> <span class="font-medium">Market Overview</span>
            </button>
            <button onclick="nav('properties')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-500 hover:bg-slate-900">
                <i class="fa-solid fa-city text-lg"></i> <span class="font-medium">Properties</span>
            </button>
            <button onclick="nav('appoinments')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-500 hover:bg-slate-900">
                <i class="fa-solid fa-calendar-check text-lg"></i> <span class="font-medium">Appoinments</span>
            </button>
            <button onclick="nav('inquiries')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-500 hover:bg-slate-900">
                <i class="fa-solid fa-comment-dots text-lg"></i> <span class="font-medium">Inquiries</span>
            </button>
            <div id="admin-tools" class="hidden">
                <div class="pt-6 pb-2 px-5 text-[10px] font-bold text-slate-600 uppercase tracking-widest border-t border-slate-900 mt-4">Admin Controls</div>
                <button onclick="nav('users')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-500 hover:bg-slate-900">
                    <i class="fa-solid fa-user-group text-lg"></i> <span class="font-medium">User Management</span>
                </button>
            </div>
            <div class="pt-6 pb-2 px-5 text-[10px] font-bold text-slate-600 uppercase tracking-widest border-t border-slate-900 mt-4">Settings</div>
            <button onclick="nav('profile')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-500 hover:bg-slate-900">
                <i class="fa-solid fa-user-gear text-lg"></i> <span class="font-medium">Profile Settings</span>
            </button>
            <button onclick="nav('ai-chat')" class="nav-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all text-slate-500 hover:bg-slate-900">
                <i class="fa-solid fa-robot text-lg"></i> <span class="font-medium">Nexus AI Chat</span>
            </button>
        </nav>
        <div class="p-8 border-t border-slate-900">
            <button onclick="logout()" class="w-full bg-slate-900 hover:bg-red-900/20 hover:text-red-500 py-4 rounded-2xl font-bold text-sm">Logout</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col">
        <header class="h-24 px-10 flex items-center justify-between border-b border-slate-900 bg-slate-950/40 backdrop-blur-md">
            <div>
                <h2 id="view-title" class="text-xl font-bold text-white tracking-tight uppercase">Overview</h2>
                <p class="text-[10px] text-slate-500 uppercase font-bold mt-1" id="real-time-clock"></p>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-bold text-white" id="usr-display"></p>
                    <p class="text-[10px] text-emerald-500 font-bold uppercase tracking-widest" id="role-display"></p>
                </div>
                <img src="https://ui-avatars.com/api/?background=10b981&color=fff&name=User" class="w-12 h-12 rounded-2xl border-2 border-slate-800 shadow-2xl">
            </div>
        </header>

        <div id="main-viewport" class="flex-1 overflow-y-auto p-10">
            <!-- Sections will load dynamically here -->
            <div id="overview-section" class="content-view">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="glass-panel p-8 rounded-[2.5rem]"><p class="text-slate-500 text-xs font-bold uppercase">Properties</p><h3 class="text-5xl font-black text-white mt-4" id="stat-p">--</h3></div>
                    <div class="glass-panel p-8 rounded-[2.5rem]"><p class="text-slate-500 text-xs font-bold uppercase">Bookings</p><h3 class="text-5xl font-black text-white mt-4" id="stat-a">--</h3></div>
                </div>
            </div>

            <div id="properties-section" class="content-view hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-bold text-white italic">Market Listings</h3>
                    <button id="add-prop-btn" onclick="toggleModal('propModal', true)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3.5 rounded-2xl font-bold shadow-lg">
                        <i class="fa-solid fa-plus mr-2"></i> Create Listing
                    </button>
                </div>
                <div id="prop-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </div>

            <div id="appoinments-section" class="content-view hidden space-y-8">
                <h3 class="text-2xl font-bold text-white italic">Scheduled Viewings</h3>
                <div class="glass-panel rounded-3xl overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900/50 border-b border-slate-800 text-emerald-500 uppercase text-[10px] font-bold">
                        <tr><th class="p-5">Node ID</th><th class="p-5">Time Sync</th><th class="p-5">Asset</th><th class="p-5">Status</th></tr>
                        </thead>
                        <tbody id="appoinment-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="inquiries-section" class="content-view hidden space-y-8">
                <h3 class="text-2xl font-bold text-white italic">Message Stream</h3>
                <div id="inquiry-list" class="space-y-4"></div>
            </div>

            <div id="users-section" class="content-view hidden space-y-8">
                <h3 class="text-2xl font-bold text-white italic">User Management</h3>
                <div class="glass-panel rounded-3xl overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900/50 border-b border-slate-800 uppercase text-[10px]">
                        <tr><th class="p-5">ID</th><th class="p-5">Name</th><th class="p-5">Email</th><th class="p-5">Action</th></tr>
                        </thead>
                        <tbody id="user-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="profile-section" class="content-view hidden max-w-2xl mx-auto space-y-8">
                <div class="glass-panel p-10 rounded-[3rem] border-emerald-500/20 shadow-2xl">
                    <h3 class="text-2xl font-bold text-white italic border-b border-slate-800 pb-5">Security & Identity</h3>
                    <form onsubmit="handleUpdateUser(event)" class="space-y-6">
                        <input type="text" id="up-un" placeholder="New Username" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none focus:border-emerald-500">
                        <input type="email" id="up-em" placeholder="New Email" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none focus:border-emerald-500">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-bold text-white">Update Profile</button>
                        <button type="button" onclick="handleDeleteUser()" class="w-full text-red-500 text-xs font-bold uppercase mt-4">Delete Account</button>
                    </form>
                </div>
            </div>

            <div id="ai-chat-section" class="content-view hidden max-w-4xl mx-auto h-[600px] flex flex-col glass-panel rounded-[3rem] overflow-hidden border-emerald-500/10">
                <div class="p-6 border-b border-slate-900 bg-slate-950/50 flex items-center gap-3"><div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-emerald-500/50"></div><span class="font-bold text-white tracking-widest text-xs uppercase">Nexus AI Assistant</span></div>
                <div id="chat-box" class="flex-1 p-10 overflow-y-auto space-y-6 text-sm leading-relaxed"></div>
                <div class="p-8 bg-slate-950/50 flex gap-4"><input type="text" id="ai-in" placeholder="Ask about property..." class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl px-6 outline-none text-sm"><button onclick="handleAIChat()" class="w-14 h-14 bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-lg transition-all active:scale-90"><i class="fa-solid fa-paper-plane"></i></button></div>
            </div>
        </div>
    </main>
</div>

<!-- MODALS -->

<!-- PROPERTY MODAL -->
<div id="propModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="glass-panel w-full max-w-3xl rounded-[3.5rem] p-12 overflow-y-auto max-h-[90vh]">
        <h3 class="text-3xl font-black text-white mb-10 border-b border-slate-800 pb-6 italic">Publish Listing</h3>
        <form onsubmit="handleSaveProperty(event)" class="space-y-8">
            <div class="grid grid-cols-2 gap-8">
                <input type="text" id="p-title" placeholder="Market Title (e.g. Modern Villa)" required class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none focus:border-emerald-500">
                <input type="number" id="p-price" placeholder="Asking Price (LKR)" required class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none focus:border-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-8">
                <input type="text" id="p-cat" placeholder="Property Type (e.g. House)" required class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none">
                <input type="text" id="p-loc" placeholder="City (e.g. Colombo)" required class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none">
            </div>
            <div class="grid grid-cols-2 gap-8">
                <input type="text" id="p-img" placeholder="Image Filename (e.g. villa1.jpg)" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none">
                <input type="text" id="p-doc" placeholder="Legal Doc Name" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-3xl font-black uppercase text-xs text-white">Publish Asset</button>
            <button type="button" onclick="toggleModal('propModal', false)" class="w-full text-slate-500 text-xs font-bold uppercase mt-2 text-center">Abort</button>
        </form>
    </div>
</div>

<!-- BOOKING MODAL -->
<div id="apModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="glass-panel w-full max-w-md rounded-[3rem] p-10 border-emerald-500/20">
        <h3 class="text-2xl font-bold text-white mb-6 border-b border-slate-800 pb-4 italic text-center">Book Viewing</h3>
        <form onsubmit="handleSaveAppoinment(event)" class="space-y-6">
            <input type="hidden" id="ap-prop-id">
            <input type="datetime-local" id="ap-date" required class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white outline-none focus:border-emerald-500">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-bold text-white shadow-lg">Confirm Appointment</button>
            <button type="button" onclick="toggleModal('apModal', false)" class="w-full text-slate-500 text-[10px] font-bold uppercase text-center mt-2">Cancel</button>
        </form>
    </div>
</div>

<!-- INQUIRY MODAL -->
<div id="inqModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="glass-panel w-full max-w-md rounded-[3rem] p-10 border-blue-500/20">
        <h3 class="text-2xl font-bold text-white mb-6 border-b border-slate-800 pb-4 italic text-center">Ask Question</h3>
        <form onsubmit="handleSaveInquiry(event)" class="space-y-6">
            <input type="hidden" id="inq-prop-id">
            <textarea id="inq-msg" placeholder="Type your message..." required class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-white h-32 outline-none focus:border-emerald-500"></textarea>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold text-white shadow-lg">Send Inquiry</button>
            <button type="button" onclick="toggleModal('inqModal', false)" class="w-full text-slate-500 text-[10px] font-bold uppercase text-center mt-2">Close</button>
        </form>
    </div>
</div>

<script>
    const TOKEN = localStorage.getItem('token');
    const USER = localStorage.getItem('username');
    const ROLE = localStorage.getItem('role');

    if(!TOKEN) window.location.href = 'login.html';

    document.getElementById('usr-display').innerText = USER || "Operator";
    document.getElementById('role-display').innerText = (ROLE || "Verified").replace('ROLE_', '');
    if(ROLE === 'ROLE_ADMIN') document.getElementById('admin-tools').classList.remove('hidden');
    if(ROLE === 'ROLE_BUYER') document.getElementById('add-prop-btn').classList.add('hidden');

    setInterval(() => { document.getElementById('real-time-clock').innerText = new Date().toLocaleString(); }, 1000);

    function nav(view) {
        document.querySelectorAll('.content-view').forEach(v => v.classList.add('hidden'));
        document.getElementById(view + '-section').classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('sidebar-active'));
        event.currentTarget.classList.add('sidebar-active');
        document.getElementById('view-title').innerText = view.replace('-', ' ');
        if(view === 'users') fetchUsers();
        if(view === 'properties') fetchProperties();
        if(view === 'appoinments') fetchAppoinments();
        if(view === 'inquiries') fetchInquiries();
    }

    function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
    function logout() { localStorage.clear(); window.location.href = 'login.html'; }

    // MODAL TRIGGERS
    function openAppoinment(pid) { document.getElementById('ap-prop-id').value = pid; toggleModal('apModal', true); }
    function openInquiry(pid) { document.getElementById('inq-prop-id').value = pid; toggleModal('inqModal', true); }

    // API: PROPERTIES
    async function fetchProperties() {
        const res = await fetch('http://localhost:8080/api/properties/all', { headers: { 'Authorization': 'Bearer ' + TOKEN }});
        const props = await res.json();
        document.getElementById('prop-grid').innerHTML = props.map(p => {
            // පින්තූරය ඇත්නම් එය පෙන්වයි, නැත්නම් Icon එකක් පෙන්වයි
            const imgPath = p.imageUrl ? `/assets/img/${p.imageUrl}` : '';
            return `
            <div class="glass-panel p-6 rounded-[2.5rem] space-y-4 hover:shadow-2xl transition-all border-emerald-500/10 border hover:border-emerald-500/40">
                <div class="h-44 bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    ${p.imageUrl ? `<img src="${p.imageUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-house-chimney text-slate-800 text-5xl"></i>`}
                </div>
                <div>
                    <h4 class="font-bold text-white text-lg truncate">${p.title}</h4>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mt-1">${p.cityName || 'City Node'}</p>
                </div>
                <p class="text-emerald-500 font-black text-xl">LKR ${p.price.toLocaleString()}</p>
                <div class="flex gap-3 pt-2">
                    <button onclick="openInquiry(${p.id})" class="flex-1 bg-slate-900 hover:bg-emerald-600/20 py-3 rounded-2xl text-[10px] font-bold uppercase border border-slate-800 hover:text-emerald-500 transition-all">Inquire</button>
                    <button onclick="openAppoinment(${p.id})" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-2xl text-[10px] font-bold uppercase text-white shadow-lg transition-all active:scale-95">Book Now</button>
                </div>
            </div>
            `}).join('');
    }

    async function handleSaveProperty(e) {
        e.preventDefault();
        const data = {
            title: document.getElementById('p-title').value,
            price: document.getElementById('p-price').value,
            categoryName: document.getElementById('p-cat').value,
            cityName: document.getElementById('p-loc').value,
            imageUrl: document.getElementById('p-img').value,
            docName: document.getElementById('p-doc').value,
            status: "AVAILABLE",
            sellerId: 1
        };
        const res = await fetch('http://localhost:8080/api/properties/save', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }, body: JSON.stringify(data) });
        if(res.ok) { alert("Asset Node Published!"); toggleModal('propModal', false); fetchProperties(); }
    }

    // OTHER API PROCESSES
    async function handleSaveAppoinment(e) {
        e.preventDefault();
        const data = { appoinmentDate: document.getElementById('ap-date').value, propertyId: document.getElementById('ap-prop-id').value, status: "PENDING" };
        const res = await fetch('http://localhost:8080/api/appoinments/book', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }, body: JSON.stringify(data) });
        if(res.ok) { alert("Appoinment Booked!"); toggleModal('apModal', false); }
    }

    async function handleSaveInquiry(e) {
        e.preventDefault();
        const data = { message: document.getElementById('inq-msg').value, propertyId: document.getElementById('inq-prop-id').value };
        const res = await fetch('http://localhost:8080/api/inquiries/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }, body: JSON.stringify(data) });
        if(res.ok) { alert("Inquiry Sent!"); toggleModal('inqModal', false); }
    }

    async function fetchAppoinments() {
        const res = await fetch('http://localhost:8080/api/appoinments/all', { headers: { 'Authorization': 'Bearer ' + TOKEN }});
        const data = await res.json();
        document.getElementById('appoinment-table-body').innerHTML = data.map(a => `<tr class="border-b border-slate-900/50 hover:bg-white/5 transition-colors"><td class="p-5 font-mono text-emerald-500">#A0${a.id}</td><td class="p-5 text-white">${new Date(a.appoinmentDate).toLocaleString()}</td><td class="p-5 text-slate-400">Node: ${a.propertyId}</td><td class="p-5"><span class="bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded-full text-[10px] font-bold">${a.status}</span></td></tr>`).join('');
    }

    async function fetchInquiries() {
        const res = await fetch('http://localhost:8080/api/inquiries/all', { headers: { 'Authorization': 'Bearer ' + TOKEN }});
        const data = await res.json();
        document.getElementById('inquiry-list').innerHTML = data.map(i => `<div class="glass-panel p-6 rounded-3xl border-l-4 border-blue-500"><p class="text-[10px] font-bold text-slate-500 uppercase mb-2">Sync Ref: ${i.id} | Asset: ${i.propertyId}</p><p class="text-white text-sm">${i.message}</p></div>`).join('');
    }

    async function fetchUsers() {
        const res = await fetch('http://localhost:8080/api/users/all', { headers: { 'Authorization': 'Bearer ' + TOKEN }});
        const users = await res.json();
        document.getElementById('user-table-body').innerHTML = users.map(u => `<tr class="border-b border-slate-900/50 hover:bg-white/5 transition-colors"><td class="p-5 font-mono text-emerald-500">#U0${u.id}</td><td class="p-5 font-bold text-white">${u.username}</td><td class="p-5 text-slate-500">${u.email}</td><td class="p-5"><button class="text-red-500 text-xs font-bold hover:underline">Revoke</button></td></tr>`).join('');
    }

    async function handleUpdateUser(e) {
        e.preventDefault();
        const data = { username: document.getElementById('up-un').value, email: document.getElementById('up-em').value };
        const res = await fetch('http://localhost:8080/api/users/update/1', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN }, body: JSON.stringify(data) });
        if(res.ok) alert("Identity Sync Complete!");
    }

    async function handleDeleteUser() {
        if(confirm("Destroy account node?")) {
            const res = await fetch('http://localhost:8080/api/users/delete/1', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + TOKEN }});
            if(res.ok) logout();
        }
    }

    function handleAIChat() {
        const input = document.getElementById('ai-in');
        const box = document.getElementById('chat-box');
        if(!input.value) return;
        box.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-600 p-5 rounded-3xl rounded-tr-none text-white max-w-[80%] shadow-xl shadow-emerald-500/10">${input.value}</div></div>`;
        const q = input.value; input.value = '';
        setTimeout(() => {
            box.innerHTML += `<div class="flex gap-4"><div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-robot"></i></div><div class="bg-slate-900 p-5 rounded-3xl rounded-tl-none border border-slate-800 max-w-[80%] italic">Nexus Intelligence analyzed "${q}". Current market trends suggest 4.2% yield.</div></div>`;
            box.scrollTop = box.scrollHeight;
        }, 1200);
    }
</script>
</body>
</html>
