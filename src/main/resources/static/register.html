<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEstate | Join the NEXUSSTATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 font-sans min-h-screen flex items-center justify-center p-4">

<div class="fixed top-1/4 left-1/3 w-80 h-80 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-1/4 right-1/3 w-80 h-80 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center p-3 bg-emerald-600/10 border border-emerald-500/20 rounded-2xl mb-4">
            <i class="fa-solid fa-house-chimney text-3xl text-emerald-500"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Create Account</h1>
        <p class="text-slate-400 text-sm mt-1">Experience premium real estate management</p>
    </div>

    <form onsubmit="register(event)" class="space-y-4">
        <input type="text" id="r-un" placeholder="Username" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500 transition-all">
        <input type="email" id="r-em" placeholder="Email Address" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500 transition-all">
        <input type="password" id="r-pw" placeholder="Password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-emerald-500 transition-all">
        <select id="r-rl" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-400 outline-none appearance-none">
            <option value="BUYER">Join as Buyer</option>
            <option value="SELLER">Join as Seller</option>
            <option value="ADMIN">Join as Admin</option>
        </select>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all active:scale-95 mt-4">
            Get Started
        </button>
    </form>
    <p class="mt-8 text-center text-sm text-slate-500">Already a member? <a href="login.html" class="text-emerald-500 font-bold hover:underline">Sign In</a></p>
</div>

<script>
    async function register(e) {
        e.preventDefault();
        const response = await fetch('http://localhost:8080/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('r-un').value,
                email: document.getElementById('r-em').value,
                password: document.getElementById('r-pw').value,
                roles: [document.getElementById('r-rl').value]
            })
        });
        if(response.ok) { alert("Registration Successful!"); window.location.href = 'login.html'; }
        else { alert("Error: Could not create account."); }
    }
</script>
</body>
</html>
