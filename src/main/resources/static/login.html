<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEstate | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 font-sans min-h-screen flex items-center justify-center p-4">

<div class="fixed top-1/4 left-1/3 w-80 h-80 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="relative w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-10 rounded-3xl shadow-2xl">
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center p-3 bg-emerald-600/10 border border-emerald-500/20 rounded-2xl mb-4">
            <i class="fa-solid fa-house-chimney text-3xl text-emerald-500"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
        <p class="text-slate-400 text-sm mt-1">Log in to manage your properties</p>
    </div>

    <form onsubmit="login(event)" class="space-y-6">
        <input type="text" id="l-un" placeholder="Username" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-white outline-none focus:border-emerald-500 transition-all">
        <input type="password" id="l-pw" placeholder="Password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-white outline-none focus:border-emerald-500 transition-all">
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all active:scale-95">
            Sign In
        </button>
    </form>
    <p class="mt-8 text-center text-sm text-slate-500">New here? <a href="register.html" class="text-emerald-500 font-bold hover:underline">Create Account</a></p>
</div>

<script>
    async function login(e) {
        e.preventDefault();
        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('l-un').value,
                password: document.getElementById('l-pw').value
            })
        });
        if(response.ok) {
            const data = await response.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('role', data.role);
            window.location.href = 'dashboard.html';
        } else { alert("Access Denied: Invalid credentials."); }
    }
</script>
</body>
</html>
