<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusEstate | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .login-bg {
            background: linear-gradient(135deg, rgba(10, 19, 31, 0.90) 0%, rgba(15, 30, 46, 0.82) 100%),
            url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600&auto=format&fit=crop&q=80') center/cover no-repeat fixed;
        }
        .glass-card {
            background: rgba(16, 29, 45, 0.78);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.22);
            box-shadow: 0 25px 50px -12px rgba(2, 12, 27, 0.75);
        }
    </style>
</head>
<body class="login-bg font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

<div class="absolute top-1/4 -left-20 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>

<div class="relative w-full max-w-md glass-card p-10 rounded-[3rem] text-slate-200">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-emerald-600 to-cyan-500 rounded-3xl mb-4 shadow-xl shadow-cyan-500/20 text-white">
            <i class="fa-solid fa-house-chimney-window text-2xl"></i>
        </div>
        <h1 class="text-3xl font-black text-white tracking-tight uppercase italic">NexusEstate</h1>
        <p class="text-[10px] font-bold text-cyan-400 tracking-[0.3em] uppercase mt-1">Enterprise Access Node</p>
    </div>

    <form onsubmit="login(event)" class="space-y-5">
        <div>
            <label class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest block mb-2 px-1">Identity Node (Username)</label>
            <div class="relative flex items-center">
                <i class="fa-solid fa-user absolute left-4 text-slate-500 text-xs"></i>
                <input type="text" id="l-un" placeholder="Enter username" required
                       class="w-full bg-[#0c1826]/90 border border-slate-700/80 rounded-2xl pl-11 pr-4 py-4 text-white text-sm outline-none focus:border-cyan-400 transition-all shadow-inner">
            </div>
        </div>

        <div>
            <label class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest block mb-2 px-1">Security Key (Password)</label>
            <div class="relative flex items-center">
                <i class="fa-solid fa-lock absolute left-4 text-slate-500 text-xs"></i>
                <input type="password" id="l-pw" placeholder="••••••••" required
                       class="w-full bg-[#0c1826]/90 border border-slate-700/80 rounded-2xl pl-11 pr-4 py-4 text-white text-sm outline-none focus:border-cyan-400 transition-all shadow-inner">
            </div>
        </div>

        <button type="submit"
                class="w-full bg-gradient-to-r from-emerald-600 via-teal-500 to-cyan-500 hover:from-emerald-500 hover:to-cyan-400 text-white font-black py-4 rounded-2xl shadow-xl shadow-teal-500/25 transition-all active:scale-95 text-xs uppercase tracking-widest mt-2 flex items-center justify-center gap-2">
            <span>Authenticate Node</span> <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
    </form>

    <p class="mt-8 text-center text-xs text-slate-400">
        Unregistered Identity?
        <a href="register.html" class="text-cyan-400 font-bold hover:text-cyan-300 hover:underline ml-1">Create Account</a>
    </p>
</div>

<script>
    async function login(e) {
        e.preventDefault();
        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('l-un').value,
                password: document.getElementById('l-pw').value
            })
        });
        if(response.ok) {
            const data = await response.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username);
            localStorage.setItem('role', data.role);
            localStorage.setItem('userId', data.userId);
            window.location.href = 'dashboard.html';
        } else {
            alert("Access Denied: Invalid credentials.");
        }
    }
</script>
</body>
</html>
